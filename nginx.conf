server {
    listen 80;
    server_name your-domain.com;
    root /path/to/dist;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 256;

    brotli on;
    brotli_static on;
    brotli_types text/css application/javascript application/json text/plain;
    brotli_comp_level 6;

    add_header Vary Accept-Encoding;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|html|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}